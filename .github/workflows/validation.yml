name: Validation

on:
  push:
    branches: [main, feature/dynamic-local-projects]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-package-lock
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package validation workspace
        if: always()
        run: tar --exclude=./.git --exclude=./dist -czf /tmp/validation-workspace.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-workspace
          path: /tmp/validation-workspace.tar.gz
          retention-days: 1
