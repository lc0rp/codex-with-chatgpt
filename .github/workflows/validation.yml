name: Validate dynamic projects

on:
  push:
    branches: [feature/dynamic-local-projects]
    paths: [.github/apply-dynamic.ready]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed patch
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          parts = sorted(pathlib.Path('.github').glob('dynamic-patch.*.b64'))
          encoded = ''.join(p.read_text().strip() for p in parts)
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '6cd736fbeb86cdc93cd277d963f8bd9700492f00ed487e2ae19fb2b91f9ca101'
          pathlib.Path('/tmp/dynamic-projects.patch').write_bytes(patch)
          PY
          git apply --unidiff-zero --check /tmp/dynamic-projects.patch
          git apply --unidiff-zero /tmp/dynamic-projects.patch
          git diff --check
      - run: npm install --ignore-scripts --no-package-lock
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit validated implementation on feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs skill src tests
          git rm .github/dynamic-patch.*.b64 .github/apply-dynamic.ready
          git commit -m 'feat: implement shared dynamic workspaces and isolated runs'
          git push origin HEAD:feature/dynamic-local-projects
          git rev-parse HEAD
